<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PaperFeed</title>
  <meta name="description" content="Follow physics journals and arXiv, keep reading lists, and search papers by meaning.">
  <meta name="theme-color" content="#f7f7fc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="PaperFeed">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Pick light/dark before the first paint so the page doesn't flash.
    try {
      const s = JSON.parse(localStorage.getItem('pf-theme') || '{}');
      const dark = s.mode === 'dark' || (s.mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      if (s.hue) document.documentElement.style.setProperty('--hue', s.hue);
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app">
    <nav class="rail" aria-label="Main"></nav>
    <main></main>
    <nav class="navbar" aria-label="Main"></nav>
  </div>
  <noscript><p style="padding:24px">PaperFeed needs JavaScript.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>

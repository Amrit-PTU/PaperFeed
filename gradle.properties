android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m
kotlin.daemon.jvmargs=-Xmx1024m
kotlin.code.style=official

# App identity. Change APP_ID to something unique (e.g. com.yourname.paperfeed) BEFORE the
# first Play Store upload; it can never change afterwards.
APP_ID=com.paperfeed
VERSION_CODE=2
VERSION_NAME=1.1
# Leave empty for Google Play builds (see PUBLISHING.md).
DONATE_URL=
